  - {id: Q-float32-naive-metric, doc: 10-performance.md, quote: "carries a relative error of 6×10⁻⁴ at 1 µm deformations",
     fn: float32_metric_error, inputs: {mode: naive, amp: 1.0e-6}, stated: 6.0e-4, rel_tol: 0.1}
  - {id: Q-float32-displacement-metric, doc: 10-performance.md, quote: "The float32 gradient error then drops to 2×10⁻⁷",
