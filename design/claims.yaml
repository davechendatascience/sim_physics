  # Measured on the reference model (design/oracles), not computed from a formula.
  - {id: Q-round-fingertip-slide, doc: 02-rigid-body-and-contact.md, quote: "slides about 4× faster than friction alone predicts",
     fn: oracle_round_fingertip_ratio, inputs: {k: 0.8}, stated: 4.0, rel_tol: 0.1}
  - {id: Q-flat-pad-slide, doc: 02-rigid-body-and-contact.md, quote: "flat pads match the prediction exactly",
     fn: oracle_flat_pad_ratio, inputs: {k: 0.8}, stated: 1.0, rel_tol: 0.01}

# Regimes of validity. Status over the parameter range: holds / marginal / violated.
#   holds     -> pass
#   marginal  -> pass only if `mitigation` is quoted in the doc
#   violated  -> pass only if `expect: violated` and `exclusion` is quoted in the doc
regimes:
  - {id: R-thin-shell, doc: 03-deformables-and-materials.md, quote: "Kirchhoff–Love shells require t/R ≲ 0.05",
     fn: ratio_range, inputs: {num: [0.95e-4, 1.05e-4], den: [0.033, 0.033]}, limit: 0.05, sense: max}
  - {id: R-continuum-wall, doc: 03-deformables-and-materials.md, quote: "A 0.1 mm can wall is only about 5–20 grains thick",
     fn: ratio_range, inputs: {num: [0.95e-4, 1.05e-4], den: [5.0e-6, 20.0e-6]}, limit: 10.0, sense: min, hard_limit: 3.0,
     mitigation: "calibrated on specimens cut from actual can walls"}
  - {id: R-rate-independence, doc: 03-deformables-and-materials.md, quote: "Aluminum at room temperature has strain-rate sensitivity m ≈ 0.002–0.012",
     fn: rate_shift_range, inputs: {m_rate: [0.002, 0.012], rate_lo: 1.0e-3, rate_hi: 10.0}, limit: 0.05, sense: max, hard_limit: 0.5,
     mitigation: "the Johnson–Cook rate term is switched on"}
  - {id: R-quasi-static-wall, doc: 03-deformables-and-materials.md, quote: "far shorter than a 0.05–1 s squeeze",
     fn: ratio_range, inputs: {num: [1.31e-5, 1.31e-5], den: [0.05, 1.0]}, limit: 0.01, sense: max}
  - {id: R-ideal-gas, doc: 03-deformables-and-materials.md, quote: "within the 5% the pressure model tolerates",
     fn: co2_deviation_range, inputs: {p_abs: [3.0e5, 5.0e5], T: 293.0, B: -1.25e-4}, limit: 0.05, sense: max}
  - {id: R-linear-slosh, doc: 03-deformables-and-materials.md, quote: "Linear slosh theory holds only while the free surface tilts a little",
     fn: ratio_range, inputs: {num: [0.5, 5.0], den: [9.81, 9.81]}, limit: 0.1, sense: max, hard_limit: 10.0,
     mitigation: "Beyond that the model switches to a particle fluid solve"}
  - {id: R-hertz-benchmark, doc: 05-case-study-soda-can.md, quote: "Hertz contact of a stiff spherical indenter on a thick elastic block",
     fn: hertz_sphere_ratio_range, inputs: {F: [10.0, 100.0], R: 0.005, E1: 210.0e9, nu1: 0.3, E2: 69.0e9, nu2: 0.33}, limit: 0.1, sense: max}
  - {id: R-hertz-pad-on-can, doc: 05-case-study-soda-can.md, quote: "The silicone pad on the can is *not* a Hertz problem",
     fn: pad_layer_ratio_range, inputs: {F: [5.0, 20.0], width: 0.015, E_pad: [1.0e6, 3.0e6], nu_pad: 0.5, R: 0.033, h_pad: [2.0e-3, 5.0e-3]},
     limit: 10.0, sense: min, expect: violated, exclusion: "That contact is validated against reference FEM and physical tests instead"}
  - {id: R-barrier-vs-molecular, doc: 02-rigid-body-and-contact.md, quote: "It stays far above the ~10⁻⁸ m range of real intermolecular forces",
     fn: ratio_range, inputs: {num: [1.0e-5, 1.0e-4], den: [1.0e-8, 1.0e-8]}, limit: 100.0, sense: min}
  - {id: R-barrier-vs-wall, doc: 02-rigid-body-and-contact.md, quote: "bounded by one tenth of the thinnest feature in contact",
     fn: ratio_range, inputs: {num: [1.0e-5, 1.0e-5], den: [1.0e-4, 1.0e-4]}, limit: 0.1, sense: max}
  - {id: R-thin-shell-sim, doc: 09-simulator.md, quote: "Thin shells** are discrete Kirchhoff–Love triangles",
     fn: ratio_range, inputs: {num: [0.95e-4, 1.05e-4], den: [0.033, 0.033]}, limit: 0.05, sense: max}
  - {id: R-ring-compliance-check, doc: 09-simulator.md, quote: "the simulator is validated at 1 N/m",
     fn: ring_deflection_ratio_range, inputs: {F: [1.0, 1.0], E: 69.0e9, nu: 0.33, t: 1.0e-4, R: 0.033}, limit: 0.05, sense: max}
  - {id: R-ring-first-yield-thin-can, doc: 09-simulator.md, quote: "The first-yield and collapse rows do **not** apply to this can",
     fn: ring_deflection_ratio_range, inputs: {F: [51.2, 99.7], E: 69.0e9, nu: 0.33, t: 1.0e-4, R: 0.033}, limit: 0.05, sense: max,
     expect: violated, exclusion: "Those rows stay in the table as formulas for thicker rings, and they are excluded for the can"}
  - {id: R-float32-displacement-uniform, doc: 10-performance.md, quote: "uniformly from 1 µm to 0.1 mm deformations",
     fn: float32_metric_error_range, inputs: {mode: displacement, amp: [1.0e-6, 1.0e-4]}, limit: 1.0e-6, sense: max}
  - {id: R-ramanujan-below-plastic-threshold, doc: 10-performance.md, quote: "the fast check can never flip a dent verdict by itself",
     fn: ramanujan_error_over_threshold_range, inputs: {ovalization: [0.0, 0.5], threshold: 2.0e-3}, limit: 1.7e-5, sense: max}
  - {id: R-ramanujan-small-ovalization, doc: 10-performance.md, quote: "below 10⁻¹⁵ up to 5% ovalization",
     fn: ramanujan_error_range, inputs: {ovalization: [0.0, 0.05]}, limit: 1.0e-15, sense: max}
  - {id: R-squeeze-quasi-static, doc: 09-simulator.md, quote: "A 0.5 s squeeze leaves inertia negligible",
     fn: squeeze_period_ratio_range, inputs: {length: 0.122, mass: 0.013, load_time: [0.5, 1.0]}, limit: 0.2, sense: max}
  - {id: R-nonrelativistic, doc: 03-deformables-and-materials.md, quote: "Speeds are ≲ 10 m/s",
     fn: ratio_range, inputs: {num: [0.0, 10.0], den: [2.998e8, 2.998e8]}, limit: 1.0e-6, sense: max}

# Values marked [calibrate]/[measure] are empirical: no derivation can confirm
# them, so each must name the test that will.
empirical:
  - {id: E-yield-strength, doc: 05-case-study-soda-can.md, quote: "~280–300 MPa, with anisotropy from rolling | Handbook *[calibrate]*",
     plan_doc: 05-case-study-soda-can.md, plan: "squeezes 30+ cans per condition to the onset of permanent deformation"}
  - {id: E-wall-thickness, doc: 05-case-study-soda-can.md, quote: "Literature *[measure]*",
     plan_doc: 05-case-study-soda-can.md, plan: "measured with a 3D scanner before and after"}
  - {id: E-internal-pressure, doc: 05-case-study-soda-can.md, quote: "Literature *[measure per product]*",
     plan_doc: 05-case-study-soda-can.md, plan: "Internal pressure of sealed cans is measured per product with a piercing pressure gauge"}
  - {id: E-dent-threshold, doc: 05-case-study-soda-can.md, quote: "not a fraction of a newton** *[calibrate]*",
     plan_doc: 05-case-study-soda-can.md, plan: "compare T2 to Abaqus/LS-DYNA on (a) lateral pad indentation of an empty can"}

# Models the design specifies, the reference model that realises each, and the
# laws each must satisfy. Every (model, law) pair must have a test case in
# tests/design tagged claim="<model>:<law>".
models:
  - id: MOD-ip-step
    doc: 01-architecture.md
    quote: "Every step solves"
    oracle: design.oracles.integrator
    laws: [linear_momentum, newton_third, energy_nonincrease, energy_first_order, angular_momentum_first_order,
           galilean_invariance, non_penetration]
  - id: MOD-friction
    doc: 02-rigid-body-and-contact.md
    quote: "Lagged, smoothed Coulomb friction potential"
    oracle: design.oracles.integrator
    laws: [coulomb_bound, stick_below_limit, kinetic_slide_rate, dissipation_nonneg, grasp_threshold]
  - id: MOD-barrier
    doc: 02-rigid-body-and-contact.md
    quote: "Guarantees no interpenetration and no tunneling"
    oracle: design.oracles.contact
    laws: [repulsive_only, infinite_at_contact, smooth_activation]
  - id: MOD-neo-hookean
    doc: 03-deformables-and-materials.md
    quote: "Neo-Hookean, Mooney–Rivlin, Ogden, Arruda–Boyce"
    oracle: design.oracles.constitutive
    laws: [objectivity, stress_free_reference, potential_consistency, linear_limit, growth, ellipticity,
           cauchy_symmetry, closed_cycle_work]
  - id: MOD-j2
    doc: 03-deformables-and-materials.md
    quote: "J2 (von Mises) with isotropic (Voce/Swift)"
    oracle: design.oracles.constitutive
    laws: [yield_consistency, dissipation_nonneg, plastic_incompressibility, drucker_ilyushin, shear_limit,
           elastic_cycle_no_dissipation]
  - id: MOD-hill48
    doc: 03-deformables-and-materials.md
    quote: "**Hill48 anisotropic yield** for rolled sheet"
    oracle: design.oracles.constitutive
    laws: [convexity, von_mises_limit]
  - id: MOD-gas
    doc: 03-deformables-and-materials.md
    quote: "the pressure term's energy is −∫p dV"
    oracle: design.oracles.constitutive
    laws: [potential_consistency, closed_cycle_work]
  - id: MOD-pressure-friction
    doc: 02-rigid-body-and-contact.md
    quote: "**Pressure-dependent friction** for elastomer pads"
    oracle: design.oracles.contact
    laws: [friction_force_monotone]

  - id: MOD-fiber-section
    doc: 09-simulator.md
    quote: "composite Simpson split at the mid-surface (9 points)"
    oracle: design.oracles.sim3d
    laws: [elastic_bending_stiffness, first_yield_at_surface, plastic_moment_limit, dissipation_nonneg,
           yield_consistency]
  - id: MOD-staggered-plasticity
    doc: 09-simulator.md
    quote: "**Plasticity is staggered.**"
    oracle: design.oracles.sim3d
    laws: [return_map_lowers_energy]
  - id: MOD-rigid-body
    doc: 02-rigid-body-and-contact.md
    quote: "Each body has a position p and a rotation Q, and vertices are x = Q X + p"
    oracle: design.oracles.sim3d
    laws: [rigid_kinetic_energy, rotation_stays_orthogonal]
  - id: MOD-contact-distance
    doc: 09-simulator.md
    quote: "**Contact** is point–triangle plus edge–edge"
    oracle: design.oracles.sim3d
    laws: [gradient_consistency, distance_lipschitz, ccd_conservative]
  - id: MOD-gas-3d
    doc: 09-simulator.md
    quote: "**Enclosed gas** is isothermal"
    oracle: design.oracles.sim3d
    laws: [potential_consistency, net_force_zero]

