# Registry of physics claims made by the design (docs/).
#
# Every entry quotes its doc verbatim (backticks and whitespace ignored), so
# a doc edit that is not mirrored here fails traceability, and vice versa.
# Checks: tests/design/. Method: docs/08-design-validation.md.
#
# Dimensions: M mass, L length, T time, Θ temperature, N amount; "1" = dimensionless.

equations:
  - id: EQ-predictor
    doc: 01-architecture.md
    quote: "q̃ = q_n + h v_n + h² M⁻¹ f_ext"
    expr: "Eq(qt, q + h*v + h**2*f/m)"
    dims: {qt: L, q: L, h: T, v: L T^-1, f: M L T^-2, m: M}
  - id: EQ-inertia-energy
    doc: 01-architecture.md
    quote: "½‖q − q̃‖²_M / h²"
    expr: "Eq(E, m*(q - qt)**2/(2*h**2))"
    dims: {E: M L^2 T^-2, m: M, q: L, qt: L, h: T}
  - id: EQ-velocity-update
    doc: 01-architecture.md
    quote: "v_{n+1} = (q_{n+1} − q_n)/h"
    expr: "Eq(v, (q1 - q0)/h)"
    dims: {v: L T^-1, q1: L, q0: L, h: T}
  - id: EQ-affine-orthogonality
    doc: 02-rigid-body-and-contact.md
    quote: "κ·V·‖AᵀA − I‖²_F"
    expr: "Eq(E, kappa*V*A2)"
    dims: {E: M L^2 T^-2, kappa: M L^-1 T^-2, V: L^3, A2: "1"}
  - id: EQ-impedance
    doc: 02-rigid-body-and-contact.md
    quote: "τ = K(q_d − q) + D(q̇_d − q̇) + τ_ff"
    expr: "Eq(tau, K*(qd - q) + D*(wd - w) + tff)"
    dims: {tau: M L^2 T^-2, K: M L^2 T^-2, qd: "1", q: "1", D: M L^2 T^-1, wd: T^-1, w: T^-1, tff: M L^2 T^-2}
  - id: EQ-barrier
    doc: 02-rigid-body-and-contact.md
    quote: "b(d) = −κ_b (d − d̂)² ln(d/d̂)"
    expr: "Eq(b, -kappa*(d - dhat)**2*log(d/dhat))"
    dims: {b: M L^2 T^-2, kappa: M T^-2, d: L, dhat: L}
  - id: EQ-friction-potential
    doc: 02-rigid-body-and-contact.md
    quote: "μ λ_n f₀(‖u_T‖)"
    expr: "Eq(D, mu*lam*u)"     # f0 has the dimension of its argument (a length)
    dims: {D: M L^2 T^-2, mu: "1", lam: M L T^-2, u: L}
  - id: EQ-pressure-friction
    doc: 02-rigid-body-and-contact.md
    quote: "μ = μ₀ (p/p₀)^(n−1)"
    expr: "Eq(mu, mu0*(p/p0)**(n - 1))"
    dims: {mu: "1", mu0: "1", p: M L^-1 T^-2, p0: M L^-1 T^-2, n: "1"}
  - id: EQ-soft-finger
    doc: 02-rigid-body-and-contact.md
    quote: "f_t²/μ² + τ_n²/(μ e)² ≤ f_n²"
    expr: "ft**2/mu**2 + tn**2/(mu*e)**2 <= fn**2"
    dims: {ft: M L T^-2, fn: M L T^-2, tn: M L^2 T^-2, mu: "1", e: L}
  - id: EQ-grasp-translational
    doc: 02-rigid-body-and-contact.md
    quote: "Σ μ_i N_i ≥ m ‖g + a‖ · SF"
    expr: "mu*N >= m*(g + a)*SF"
    dims: {mu: "1", N: M L T^-2, m: M, g: L T^-2, a: L T^-2, SF: "1"}
  - id: EQ-grasp-torsion
    doc: 02-rigid-body-and-contact.md
    quote: "Σ μ_i e_i N_i ≥ m ‖g + a‖ ‖r_⊥‖"
    expr: "mu*e*N >= m*(g + a)*r"
    dims: {mu: "1", e: L, N: M L T^-2, m: M, g: L T^-2, a: L T^-2, r: L}
  - id: EQ-gas-energy
    doc: 03-deformables-and-materials.md
    quote: "−∫p dV"
    expr: "Eq(E, -Integral(p, V))"
    dims: {E: M L^2 T^-2, p: M L^-1 T^-2, V: L^3}
  - id: EQ-hoop-stress
    doc: 05-case-study-soda-can.md
    quote: "σ_θ = pR/t"
    expr: "Eq(sigma, p*R/t)"
    dims: {sigma: M L^-1 T^-2, p: M L^-1 T^-2, R: L, t: L}
  - id: EQ-fmin
    doc: 05-case-study-soda-can.md
    quote: "F_min per finger = m (g + a) / (2 μ)"
    expr: "Eq(F, m*(g + a)/(2*mu))"
    dims: {F: M L T^-2, m: M, g: L T^-2, a: L T^-2, mu: "1"}
  - id: EQ-bending-length
    doc: 05-case-study-soda-can.md
    quote: "ℓ ≈ √(R t) / [3(1−ν²)]^¼"
    expr: "Eq(ell, sqrt(R*t)/(3*(1 - nu**2))**Rational(1, 4))"
    dims: {ell: L, R: L, t: L, nu: "1"}
  - id: EQ-dent-scale
    doc: 05-case-study-soda-can.md
    quote: "P_dent ~ C · σ_y · t^{3/2} · R^{1/2}"
    expr: "Eq(P, C*sy*t**Rational(3, 2)*R**Rational(1, 2))"
    dims: {P: M L T^-2, C: "1", sy: M L^-1 T^-2, t: L, R: L}
  # docs/09 long-cylinder limit: per unit length of can (F in N/m, I and M per metre)
  - id: EQ-plane-strain-modulus
    doc: 09-simulator.md
    quote: "E' = E/(1 − ν²)"
    expr: "Eq(Ep, E/(1 - nu**2))"
    dims: {Ep: M L^-1 T^-2, E: M L^-1 T^-2, nu: "1"}
  - id: EQ-fiber-strain
    doc: 09-simulator.md
    quote: "ε(z) = ε_m + z κ"
    expr: "Eq(eps, eps_m + z*kappa)"
    dims: {eps: "1", eps_m: "1", z: L, kappa: L^-1}
  - id: EQ-ring-compliance
    doc: 09-simulator.md
    quote: "δ = (π/4 − 2/π) F R³/(E' I)"
    expr: "Eq(delta, (pi/4 - 2/pi)*F*R**3/(Ep*I))"
    dims: {delta: L, F: M T^-2, R: L, Ep: M L^-1 T^-2, I: L^3}
  - id: EQ-first-yield-stress
    doc: 09-simulator.md
    quote: "σ_1y = σ_y/√(1 − ν + ν²)"
    expr: "Eq(s1y, sy/sqrt(1 - nu + nu**2))"
    dims: {s1y: M L^-1 T^-2, sy: M L^-1 T^-2, nu: "1"}
  - id: EQ-first-yield-load
    doc: 09-simulator.md
    quote: "F_y = π M_y / R"
    expr: "Eq(Fy, pi*My/R)"
    dims: {Fy: M T^-2, My: M L T^-2, R: L}
  - id: EQ-first-yield-moment
    doc: 09-simulator.md
    quote: "M_y = σ_1y t²/6"
    expr: "Eq(My, s1y*t**2/6)"
    dims: {My: M L T^-2, s1y: M L^-1 T^-2, t: L}
  - id: EQ-plastic-moment
    doc: 09-simulator.md
    quote: "M_p = σ_y' t²/4"
    expr: "Eq(Mp, syp*t**2/4)"
    dims: {Mp: M L T^-2, syp: M L^-1 T^-2, t: L}
  - id: EQ-collapse-load
    doc: 09-simulator.md
    quote: "F_c = 4 M_p / R"
    expr: "Eq(Fc, 4*Mp/R)"
    dims: {Fc: M T^-2, Mp: M L T^-2, R: L}
  - id: EQ-ring-buckling
    doc: 09-simulator.md
    quote: "p_cr = 3 E' I / R³"
    expr: "Eq(pcr, 3*Ep*I/R**3)"
    dims: {pcr: M L^-1 T^-2, Ep: M L^-1 T^-2, I: L^3, R: L}

  # docs/10 performance
  - id: EQ-metric-displacement-form
    doc: 10-performance.md
    quote: "a − ā = E·Dᵀ + D·Eᵀ + D·Dᵀ"
    expr: "Eq(da, E*D + D*E + D*D)"
    dims: {da: L^2, E: L, D: L}
  - id: EQ-ramanujan-perimeter
    doc: 10-performance.md
    quote: "P ≈ π (a + b) (1 + 3h / (10 + √(4 − 3h)))"
    expr: "Eq(P, pi*(a + b)*(1 + 3*h/(10 + sqrt(4 - 3*h))))"
    dims: {P: L, a: L, b: L, h: "1"}
  - id: EQ-rim-hoop-strain
    doc: 10-performance.md
    quote: "The hoop strain is P / (2πR) − 1"
    expr: "Eq(eps, P/(2*pi*R) - 1)"
    dims: {eps: "1", P: L, R: L}

