  - {id: Q-ramanujan-margin, doc: 10-performance.md, quote: "at least 6×10⁴ times smaller than the 2×10⁻³ plastic-strain threshold",
     fn: ramanujan_margin, inputs: {ovalization: 0.5, threshold: 2.0e-3}, stated: 6.0e4, rel_tol: 0.05}
  - {id: Q-ramanujan-50pct, doc: 10-performance.md, quote: "3.3×10⁻⁸ at 50%",
     fn: ramanujan_perimeter_error, inputs: {ovalization: 0.5}, stated: 3.3e-8, rel_tol: 0.05}
