     inputs: {p: 0.25e6, R: 0.033, t: 1.0e-4}, stated: 80.0e6, rel_tol: 0.1}
  - {id: Q-bending-length, doc: 05-case-study-soda-can.md, quote: "≈ 1.4 mm", fn: bending_length,
     inputs: {R: 0.033, t: 1.0e-4, nu: 0.33}, stated: 1.4e-3, rel_tol: 0.05}
  - {id: Q-dent-scale, doc: 05-case-study-soda-can.md, quote: "≈ 50 N", fn: dent_scale,
     inputs: {sy: 290.0e6, t: 1.0e-4, R: 0.033}, stated: 50.0, rel_tol: 0.1}
  - {id: Q-fmin-full-dry, doc: 05-case-study-soda-can.md, quote: "0.38·14.8 / 1.6 ≈ **3.5 N**", fn: fmin,
     inputs: {m: 0.38, a: 5.0, mu: 0.8}, stated: 3.5, rel_tol: 0.03}
