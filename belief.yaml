priors: []

policies:
  - id: POL-design-freeze
    criteria:
      - {slice: CTR-design-dimensional, require: supported}
      - {slice: CTR-design-balance-laws, require: supported}
      - {slice: CTR-design-admissibility, require: supported}
      - {slice: CTR-design-quantities, require: supported}
      - {slice: CTR-design-regime, require: supported}
      - {slice: CTR-design-traceability, require: supported}
    weights: null

  - id: POL-sim-release
    criteria:
      - {slice: CTR-sim-e2e, require: supported}
      - {slice: CTR-sim-solver, require: supported}
      - {slice: CTR-sim-contact, require: supported}
      - {slice: CTR-sim-bodies, require: supported}
      - {slice: CTR-sim-materials, require: supported}
      - {slice: CTR-sim-ledger, require: supported}
      - {slice: CTR-sim-render, require: supported}
      - {slice: CTR-sim-analytic, require: supported}
      - {slice: CTR-sim-adjoint, require: supported}
      - {safety_gates: all_passed}
    weights: null
