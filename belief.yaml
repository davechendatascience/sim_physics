# Declarations for sim_physics.
#
# The server reads this file from git HEAD, not the working tree: edits take
# effect only once a human commits them.
#
# Layering. The belief server has no notion of one component containing
# another, so containment is written into the ids: CMP-sim encloses
# CMP-sim.solver, CMP-sim.contact, ..., CMP-sim.analytic. Its end-to-end test runs the whole
# simulator; each part has its own component test, so diagnosis can say which
# part is responsible. CMP-design-process gates every implementation component
# through an IFC-design__<component> interface (see CLAUDE.md).

components:
  - id: CMP-design-process
    purpose: >-
      Turn classical physics and materials knowledge into design claims
      (docs/ + design/claims.yaml) that implementation is allowed to build on
    outputs: [IFC-design__sim.solver, IFC-design__sim.contact, IFC-design__sim.bodies,
              IFC-design__sim.materials, IFC-design__sim.ledger, IFC-design__sim.render,
              IFC-design__sim.analytic, IFC-design__sim.adjoint]
    testable_capability: >-
      Every physics statement in the design is registered, dimensionally
      consistent, satisfies classical balance and thermodynamic laws when run
      as a small reference model, reproduces its stated numbers, is used only
      inside its regime of validity, and stays consistent across documents
    failure_modes:
      - {id: FM-dimension, observable: an equation mixes dimensions or feeds a dimensioned argument to ln/exp}
      - {id: FM-balance, observable: a reference model creates momentum or energy, or violates Newton's third law}
      - {id: FM-thermo, observable: a model dissipates negative energy, is not frame-indifferent, or loses ellipticity in its stated range}
      - {id: FM-numeric, observable: a number in the docs does not follow from its stated inputs}
      - {id: FM-regime, observable: a model is used outside the regime where classical continuum physics holds}
      - {id: FM-trace, observable: a doc statement and its registered claim disagree, or an empirical value is untagged}
    remediation: >-
      Amend the doc and design/claims.yaml together. If the check itself is
      wrong, fix the reference model with a stated reason. Never loosen a
      tolerance to make a check pass.

  - id: CMP-sim
    purpose: The simulator (simphys), enclosing the eight components below
    inputs: [IFC-solver__sim, IFC-ledger__sim, IFC-render__sim, IFC-analytic__sim, IFC-adjoint__sim]
    testable_capability: >-
      Every built-in scene runs from the command line, headless, and writes
      its animation, final frame, and ledger summary
    failure_modes:
      - {id: FM-sim-crash, observable: a built-in scene exits non-zero}
      - {id: FM-sim-output, observable: a headless run does not write its GIF, PNG or JSON summary}
    remediation: Diagnose which enclosed component fails its own contract first

  - id: CMP-sim.solver
    purpose: Incremental-potential time step with Newton on increments (rotations on SO(3))
    inputs: [IFC-design__sim.solver, IFC-bodies__solver, IFC-contact__solver]
    outputs: [IFC-solver__sim, IFC-solver__ledger, IFC-solver__render, IFC-solver__adjoint]
    testable_capability: >-
      Reproduces implicit Euler exactly in free fall, conserves linear momentum
      through collisions, never increases energy without external work, and
      converges in a handful of Newton iterations on resting contact
    failure_modes:
      - {id: FM-solver-momentum, observable: total momentum drifts in an isolated collision}
      - {id: FM-solver-energy, observable: energy rises on frictionless ground}
      - {id: FM-solver-stall, observable: Newton needs many iterations on a resting contact}
    remediation: simphys/scene.py energy() and step(); check PSD projection and the rotation curvature term

  - id: CMP-sim.contact
    purpose: IPC barrier with shell-thickness offsets, Lipschitz-sampled CCD, lagged friction
    inputs: [IFC-design__sim.contact]
    outputs: [IFC-contact__solver]
    testable_capability: >-
      No interpenetration or tunnelling, shells keep their thickness, and a
      block on an incline sticks or slides as Coulomb friction predicts
    failure_modes:
      - {id: FM-contact-penetration, observable: any contact gap reaches zero, or a fast body passes through a plate}
      - {id: FM-contact-friction, observable: incline stick/slide disagrees with Coulomb}
    remediation: simphys/collision.py (broad phase, ccd) and the contact kernels in simphys/kernels.py

  - id: CMP-sim.bodies
    purpose: Rigid bodies (exact rotations), discrete Kirchhoff-Love shells, Neo-Hookean tets
    inputs: [IFC-design__sim.bodies, IFC-materials__bodies]
    outputs: [IFC-bodies__solver]
    testable_capability: >-
      Rigid bodies stay exactly rigid; a rolled strip stores plate-theory
      bending energy; a long can matches ring compliance and converges with
      mesh refinement; shell energy is frame-indifferent
    failure_modes:
      - {id: FM-bodies-rigidity, observable: a spinning body's rotation drifts off SO(3)}
      - {id: FM-bodies-shell, observable: shell bending or ring compliance disagrees with theory, or does not converge}
    remediation: simphys/bodies.py and the shell kernel in simphys/kernels.py

  - id: CMP-sim.materials
    purpose: Plane-stress J2 through the shell thickness, isothermal enclosed gas
    inputs: [IFC-design__sim.materials]
    outputs: [IFC-materials__bodies]
    testable_capability: >-
      The return map agrees with the design's reference model, is the identity
      below yield, and a sealed can swells by the thin-wall hoop strain
    failure_modes:
      - {id: FM-materials-return-map, observable: the return map disagrees with design/oracles/sim3d.py}
      - {id: FM-materials-gas, observable: pressurised can expansion disagrees with pR/(tE)(1 - nu/2)}
    remediation: simphys/materials.py and the gas terms in simphys/scene.py

  - id: CMP-sim.ledger
    purpose: Irreversible-state verdict per shell (plastic strain, residual shape)
    inputs: [IFC-design__sim.ledger, IFC-solver__ledger]
    outputs: [IFC-ledger__sim]
    testable_capability: >-
      Rigid motion is not an alteration; plastic strain or a residual dent
      above the design thresholds is; a light squeeze and release leaves the
      can unaltered
    failure_modes:
      - {id: FM-ledger-false-alarm, observable: a moved or elastically loaded can is reported altered}
      - {id: FM-ledger-miss, observable: plastic strain or a dent above threshold is not reported}
    remediation: simphys/ledger.py

  - id: CMP-sim.analytic
    purpose: Fast analytic tier - a can pinched between long flat pads (ring elastica, docs/11)
    inputs: [IFC-design__sim.analytic]
    outputs: [IFC-analytic__sim]
    testable_capability: >-
      Force-gap curve, flat-contact onset and first yield agree with the
      design's quadrature reference model in both contact phases, and a whole
      curve evaluates in well under a second
    failure_modes:
      - {id: FM-analytic-mismatch, observable: force disagrees with design/oracles/elastica.py}
      - {id: FM-analytic-regime, observable: results reported past first yield or for short pads}
    remediation: simphys/analytic.py

  - id: CMP-sim.adjoint
    purpose: Implicit derivatives of the 3D solver through time (docs/12)
    inputs: [IFC-design__sim.adjoint, IFC-solver__adjoint]
    outputs: [IFC-adjoint__sim]
    testable_capability: >-
      Gradients of a final-state objective with respect to a material
      parameter and the initial velocity match finite differences of the
      forward simulation, the forward run is unchanged by recording, and a run
      with plastic flow is refused rather than differentiated wrongly
    failure_modes:
      - {id: FM-adjoint-mismatch, observable: gradient disagrees with finite differences of the forward run}
      - {id: FM-adjoint-silent, observable: a gradient is returned for a run with plastic flow}
    remediation: simphys/adjoint.py and the unprojected Hessian path in simphys/scene.py

  - id: CMP-sim.render
    purpose: CPU-only matplotlib rendering, headless (GIF/PNG) or windowed
    inputs: [IFC-design__sim.render, IFC-solver__render]
    outputs: [IFC-render__sim]
    testable_capability: Headless runs write an animated GIF with one frame per draw and a final PNG
    failure_modes:
      - {id: FM-render-output, observable: frames or files missing, or an unknown mode accepted}
    remediation: simphys/render.py

interfaces:
  - id: IFC-design__sim.solver
    producer: CMP-design-process
    consumer: CMP-sim.solver
    semantics: The incremental-potential step of docs/01 §3 and its conservation properties
    producer_guarantees: [linear momentum exact; energy and angular momentum first order and never gained]
    consumer_assumptions: [linear momentum exact; energy and angular momentum first order and never gained]
  - id: IFC-design__sim.contact
    producer: CMP-design-process
    consumer: CMP-sim.contact
    semantics: IPC barrier, CCD and smoothed Coulomb friction of docs/02 §2, thickness offsets of docs/09
    producer_guarantees: [barrier repulsive only and infinite at contact; friction bounded by Coulomb and dissipative]
    consumer_assumptions: [barrier repulsive only and infinite at contact; friction bounded by Coulomb and dissipative]
  - id: IFC-design__sim.bodies
    producer: CMP-design-process
    consumer: CMP-sim.bodies
    semantics: Rigid bodies with exact rotations (docs/02 §1); shells and solids (docs/09 §2)
    producer_guarantees: [rigid kinetic energy exact; shell integration exact for elastic, first-yield and plastic limits]
    consumer_assumptions: [rigid kinetic energy exact; shell integration exact for elastic, first-yield and plastic limits]
  - id: IFC-design__sim.materials
    producer: CMP-design-process
    consumer: CMP-sim.materials
    semantics: Plane-stress J2 and enclosed gas (docs/03, docs/09 §2), validated against design/oracles
    producer_guarantees: [return map dissipative and yield-consistent; gas force is minus the energy gradient]
    consumer_assumptions: [return map dissipative and yield-consistent; gas force is minus the energy gradient]
  - id: IFC-design__sim.ledger
    producer: CMP-design-process
    consumer: CMP-sim.ledger
    semantics: Irreversibility thresholds of docs/03 §4
    producer_guarantees: [plastic strain threshold 2e-3; residual shape threshold 0.1 mm]
    consumer_assumptions: [plastic strain threshold 2e-3; residual shape threshold 0.1 mm]
  - id: IFC-design__sim.render
    producer: CMP-design-process
    consumer: CMP-sim.render
    semantics: CPU-only rendering of docs/09 §3
    producer_guarantees: [matplotlib only, no GPU; shells coloured by plastic strain]
    consumer_assumptions: [matplotlib only, no GPU; shells coloured by plastic strain]
  - id: IFC-design__sim.analytic
    producer: CMP-design-process
    consumer: CMP-sim.analytic
    semantics: Ring-elastica closed forms of docs/11 and their regime (long pads, elastic, open can)
    producer_guarantees: [closed forms match quadrature to 1e-7; valid only up to first yield for long pads]
    consumer_assumptions: [closed forms match quadrature to 1e-7; valid only up to first yield for long pads]
  - id: IFC-analytic__sim
    producer: CMP-sim.analytic
    consumer: CMP-sim
    semantics: Force-gap curve and first-yield verdict for the long-pad pinch
    producer_guarantees: [no result past first yield is reported as elastic]
    consumer_assumptions: [no result past first yield is reported as elastic]
  - id: IFC-design__sim.adjoint
    producer: CMP-design-process
    consumer: CMP-sim.adjoint
    semantics: Implicit differentiation rules of docs/12 (exact Hessian, converged steps, backward-only smoothing)
    producer_guarantees: [adjoint uses the unprojected Hessian; forward pass never altered by differentiation]
    consumer_assumptions: [adjoint uses the unprojected Hessian; forward pass never altered by differentiation]
  - id: IFC-solver__adjoint
    producer: CMP-sim.solver
    consumer: CMP-sim.adjoint
    semantics: Recorded step states, targets and friction lag; exact Hessian on request
    producer_guarantees: [energy can be assembled without PSD projection at any recorded state]
    consumer_assumptions: [energy can be assembled without PSD projection at any recorded state]
  - id: IFC-adjoint__sim
    producer: CMP-sim.adjoint
    consumer: CMP-sim
    semantics: Gradients of objectives of the final state
    producer_guarantees: [no gradient returned through unmodelled plastic flow]
    consumer_assumptions: [no gradient returned through unmodelled plastic flow]
  - id: IFC-materials__bodies
    producer: CMP-sim.materials
    consumer: CMP-sim.bodies
    semantics: Return map and material constants used by shell faces
    producer_guarantees: [return map vectorised over faces and fibers; stress never outside the yield surface]
    consumer_assumptions: [return map vectorised over faces and fibers; stress never outside the yield surface]
  - id: IFC-bodies__solver
    producer: CMP-sim.bodies
    consumer: CMP-sim.solver
    semantics: Per-stencil energies, gradients and Hessians; rigid mass properties
    producer_guarantees: [stencil energies differentiable by JAX; rigid second moment J about the centre of mass]
    consumer_assumptions: [stencil energies differentiable by JAX; rigid second moment J about the centre of mass]
  - id: IFC-contact__solver
    producer: CMP-sim.contact
    consumer: CMP-sim.solver
    semantics: Active pairs with offsets, a safe step fraction, friction lag data
    producer_guarantees: [every pair within reach is found; the step fraction keeps every gap positive]
    consumer_assumptions: [every pair within reach is found; the step fraction keeps every gap positive]
  - id: IFC-solver__ledger
    producer: CMP-sim.solver
    consumer: CMP-sim.ledger
    semantics: Converged shell configurations and plastic state after each step
    producer_guarantees: [plastic state updated after every converged step]
    consumer_assumptions: [plastic state updated after every converged step]
  - id: IFC-solver__render
    producer: CMP-sim.solver
    consumer: CMP-sim.render
    semantics: Vertex positions of every body at the current time
    producer_guarantees: [positions of all bodies in one array with per-body offsets]
    consumer_assumptions: [positions of all bodies in one array with per-body offsets]
  - id: IFC-solver__sim
    producer: CMP-sim.solver
    consumer: CMP-sim
    semantics: Stepping for every built-in scene
    producer_guarantees: [every built-in scene steps without error]
    consumer_assumptions: [every built-in scene steps without error]
  - id: IFC-ledger__sim
    producer: CMP-sim.ledger
    consumer: CMP-sim
    semantics: Ledger summary written with every run
    producer_guarantees: [one report per shell body]
    consumer_assumptions: [one report per shell body]
  - id: IFC-render__sim
    producer: CMP-sim.render
    consumer: CMP-sim
    semantics: Files written by headless runs
    producer_guarantees: [GIF and PNG written next to the requested path]
    consumer_assumptions: [GIF and PNG written next to the requested path]

contracts:
  # --- design process ---
  - id: CTR-design-dimensional
    subject: CMP-design-process
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.7}
    trial_identity: [claim]
    evaluable_by: [TST-design-dimensional]
    sufficiency: {n_min: 8, max_ci_width: 0.35}

  - id: CTR-design-balance-laws
    subject: CMP-design-process
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.7}
    trial_identity: [claim]
    evaluable_by: [TST-design-balance]
    sufficiency: {n_min: 8, max_ci_width: 0.35}

  - id: CTR-design-admissibility
    subject: CMP-design-process
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.7}
    trial_identity: [claim]
    evaluable_by: [TST-design-admissibility]
    sufficiency: {n_min: 8, max_ci_width: 0.35}

  - id: CTR-design-quantities
    subject: CMP-design-process
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.7}
    trial_identity: [claim]
    evaluable_by: [TST-design-quantities]
    sufficiency: {n_min: 8, max_ci_width: 0.35}

  - id: CTR-design-regime
    subject: CMP-design-process
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.7}
    trial_identity: [claim]
    evaluable_by: [TST-design-regime]
    sufficiency: {n_min: 8, max_ci_width: 0.35}

  - id: CTR-design-traceability
    subject: CMP-design-process
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.7}
    trial_identity: [claim]
    evaluable_by: [TST-design-traceability]
    sufficiency: {n_min: 8, max_ci_width: 0.35}

  # --- simulator: each part has few, expensive, deterministic checks, so the
  # --- sufficiency bar is lower than the design's; a single failure still
  # --- shows as a failed trial and is fixed immediately
  - id: CTR-sim-e2e
    subject: CMP-sim
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.6}
    trial_identity: [claim]
    evaluable_by: [TST-sim-e2e]
    sufficiency: {n_min: 4, max_ci_width: 0.5}

  - id: CTR-sim-solver
    subject: CMP-sim.solver
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.6}
    trial_identity: [claim]
    evaluable_by: [TST-sim-solver]
    sufficiency: {n_min: 4, max_ci_width: 0.5}

  - id: CTR-sim-contact
    subject: CMP-sim.contact
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.6}
    trial_identity: [claim]
    evaluable_by: [TST-sim-contact]
    sufficiency: {n_min: 4, max_ci_width: 0.5}

  - id: CTR-sim-bodies
    subject: CMP-sim.bodies
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.6}
    trial_identity: [claim]
    evaluable_by: [TST-sim-bodies]
    sufficiency: {n_min: 4, max_ci_width: 0.5}

  - id: CTR-sim-materials
    subject: CMP-sim.materials
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.5}
    trial_identity: [claim]
    evaluable_by: [TST-sim-materials]
    sufficiency: {n_min: 3, max_ci_width: 0.6}

  - id: CTR-sim-ledger
    subject: CMP-sim.ledger
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.6}
    trial_identity: [claim]
    evaluable_by: [TST-sim-ledger]
    sufficiency: {n_min: 4, max_ci_width: 0.5}

  - id: CTR-sim-analytic
    subject: CMP-sim.analytic
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.6}
    trial_identity: [claim]
    evaluable_by: [TST-sim-analytic]
    sufficiency: {n_min: 4, max_ci_width: 0.5}

  - id: CTR-sim-adjoint
    subject: CMP-sim.adjoint
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.6}
    trial_identity: [claim]
    evaluable_by: [TST-sim-adjoint]
    sufficiency: {n_min: 4, max_ci_width: 0.5}

  - id: CTR-sim-render
    subject: CMP-sim.render
    claim_type: capability
    metrics: [{id: passed, unit: bool}]
    acceptance: {rule: "passed == true", target_rate: 0.5}
    trial_identity: [claim]
    evaluable_by: [TST-sim-render]
    sufficiency: {n_min: 2, max_ci_width: 0.7}

tests:
