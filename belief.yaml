    layer: component
    targets: [CMP-design-process]
    run: python tools/design_trials.py $OUT -- tests/design/test_dimensional.py -q
    metrics: [passed]
    capture: [claim, doc, law]
    mandatory: true

  - id: TST-design-balance
    layer: component
    targets: [CMP-design-process]
    run: python tools/design_trials.py $OUT -- tests/design/test_balance_laws.py -q
    metrics: [passed]
    capture: [claim, doc, law]
    mandatory: true

